name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: |
          npm audit --audit-level=high
          npm audit --audit-level=high --package-lock-only --prefix workers/files

      - name: Compute base path
        id: base
        shell: bash
        run: |
          repo="${GITHUB_REPOSITORY#*/}"

          if [[ "$repo" == *.github.io ]]; then
            echo "path=/" >> "$GITHUB_OUTPUT"
          else
            echo "path=/${repo}/" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify Supabase environment
        shell: bash
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_FILES_URL: ${{ vars.VITE_FILES_URL }}
        run: |
          missing=0
          if [[ -z "${VITE_SUPABASE_URL}" ]]; then
            echo "::error::Missing repository variable VITE_SUPABASE_URL. Add it under Settings > Secrets and variables > Actions > Variables."
            missing=1
          fi
          if [[ -z "${VITE_SUPABASE_ANON_KEY}" ]]; then
            echo "::error::Missing VITE_SUPABASE_ANON_KEY. Add it under Settings > Secrets and variables > Actions > Variables or Secrets."
            missing=1
          fi
          if [[ "${VITE_SUPABASE_URL}" != https://*.supabase.co ]]; then
            echo "::error::VITE_SUPABASE_URL should look like https://your-project.supabase.co."
            missing=1
          fi
          if [[ -n "${VITE_FILES_URL}" && "${VITE_FILES_URL}" != https://* ]]; then
            echo "::error::VITE_FILES_URL should be the https:// URL of the paperink-files Worker."
            missing=1
          fi
          exit "${missing}"

      - name: Build
        run: npm run build
        env:
          BASE_PATH: ${{ steps.base.outputs.path }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_FILES_URL: ${{ vars.VITE_FILES_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
